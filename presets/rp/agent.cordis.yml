# dsh-rrp · RP 模式（Author 叙事执笔）的 agent-plane 组合。
#
# 一个 preset 就是 DSH 原生的「模式」：本文件声明该模式下的 agent 组合。
# persona 行是 scope-only 的：它只在这个 preset 的 agent 作用域里遮蔽部署默认
# persona，不会污染宿主全局，也不会串到其他模式的会话。
- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    # Author 的文本就是完整系统提示：宿主其余提示词段落一律不再附加，
    # 避免「编码助手」身份串味。
    complete: true
    # 屏蔽动态运行环境快照（cwd / 时间等），RP 正文不需要这些噪声。
    includeRuntimeContext: false
    # 结构对齐一线 agent 系统提示词规范：身份一段定论 → 编号铁律 →
    # 资源获取 → 输出契约 → 创作授权（深度注入位收尾）。全文英文撰写，
    # 正文输出语言在身份段用硬性条款锁定为简体中文。
    # 提示词正文单一来源是 src/agents/author.ts 的 AUTHOR_SYSTEM_PROMPT
    # （issue #32）：物化时 src/preset.ts 把下一行这个 token 替换为块标量缩进
    # 后的完整提示词，与 YAML 内嵌写法逐字节等价，且可以被单测直接断言。
    prefix: |-
      __DSH_RRP_AUTHOR_PROMPT__

# ── 知识体系（D7：Skills 替代 Lorebook）────────────────────────────────────
# skill-filesystem 只在这个 preset 的作用域里注册本地技能根：除默认的项目根/用户根
# 之外，额外把随包分发的世界设定目录（bundledSkillDir，由插件物化时写入绝对路径）
# 纳入扫描；tool-skill 把目录暴露给模型，按需调取、渐进披露，而不是把设定硬塞进上下文。
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    bundledSkillDir: '__DSH_RRP_SKILL_DIR__'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
